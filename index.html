<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFF3E0">
<link rel="icon" href="favicon.svg">
<title>Low Tide© — Drop 01</title>
<meta name="description" content="Low Tide© — limited streetwear from Cebu, PH. Drop 01: Shoreline. Only when the water's out.">
<link rel="preload" as="image" href="hero2.jpg" imagesrcset="hero2-sm.jpg 1280w, hero2.jpg 2576w" imagesizes="100vw">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF3E0; --fg:#1a1410; --brand:#D62828; --muted:#8c7f72; --line:rgba(26,20,16,.12);
  --font:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --gutter:16px; --header-h:52px; --ease:cubic-bezier(.2,.7,.2,1);
}
@media(min-width:990px){:root{--gutter:24px}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,p{margin:0}
.caps{text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:500}
.muted{color:var(--muted)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.page-width{max-width:1600px;margin:0 auto;padding:0 var(--gutter)}
.wordmark{font-weight:800;letter-spacing:-.06em;line-height:.85;white-space:nowrap}
.wordmark sup{font-size:.32em;vertical-align:top;position:relative;top:.12em;margin:0 .04em;letter-spacing:0;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;background:var(--brand);color:var(--bg);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:500;padding:0 18px;min-height:40px;transition:opacity .2s var(--ease)}
.btn:hover{opacity:.8}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.btn--full{width:100%;min-height:48px}
.btn--light{background:var(--bg);color:var(--brand);min-height:32px;padding:0 14px}
.link{text-decoration:underline;text-underline-offset:3px}

/* ---------- header ---------- */
.site-header{position:sticky;top:0;z-index:40;background:var(--bg);color:var(--fg);transition:background .3s var(--ease),color .3s var(--ease)}
.is-home .site-header{position:fixed;left:0;right:0;background:transparent;color:var(--fg)}
.is-home .site-header.is-scrolled,.menu-open .site-header{background:var(--bg);color:var(--fg)}
.site-header__inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:var(--header-h);padding:0 var(--gutter)}
.site-header__nav ul{display:flex;gap:18px}
.site-header__nav a{opacity:.9;transition:opacity .2s}
.site-header__nav a:hover,.site-header__nav a[aria-current]{opacity:1;text-decoration:underline;text-underline-offset:3px}
.site-header__logo{font-size:17px}
.site-header:not(.is-overlay) .site-header__logo{color:var(--brand)}

.coll-head h1,.contact-h{color:var(--brand)}
.newsletter h2{color:var(--brand)}
.site-header__cart{justify-self:end}
.burger{display:none;width:22px;height:14px;position:relative}
.burger span{position:absolute;left:0;right:0;height:1.5px;background:currentColor;transition:transform .3s var(--ease),top .3s var(--ease)}
.burger span:first-child{top:3px}.burger span:last-child{top:10px}
.menu-open .burger span:first-child{top:6.5px;transform:rotate(45deg)}
.menu-open .burger span:last-child{top:6.5px;transform:rotate(-45deg)}
.mobile-menu{display:none}
@media(max-width:749px){
  .site-header__nav{display:none}
  .burger{display:block}
  .mobile-menu{display:block;position:fixed;inset:var(--header-h) 0 0;background:var(--bg);color:var(--fg);padding:24px var(--gutter);opacity:0;visibility:hidden;transition:opacity .25s var(--ease),visibility .25s}
  .menu-open .mobile-menu{opacity:1;visibility:visible}
  .mobile-menu a{display:block;font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.15;text-transform:uppercase}
}

/* ---------- view transitions ---------- */
#view{animation:viewIn .35s var(--ease)}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
.leaving #view{opacity:0;transition:opacity .2s var(--ease)}

/* ---------- hero ---------- */
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden;color:var(--brand);background:#FFF2DF}
.hero__media{position:absolute;inset:0;will-change:transform;transform-origin:70% 60%}
.hero__float{position:absolute;inset:0;transform:translate3d(calc(var(--mx,0) * -14px),calc(var(--my,0) * -10px),0);transition:transform .9s var(--ease)}
.hero__media img{width:100%;height:100%;object-fit:cover;object-position:center;animation:heroIn 1.8s var(--ease) .1s both,drift 16s ease-in-out 2s infinite alternate}
@keyframes heroIn{from{clip-path:inset(0 0 0 100%);transform:scale(1.08) translateX(4%);filter:blur(10px)}to{clip-path:inset(0 0 0 0);transform:none;filter:none}}
@keyframes drift{from{transform:translateX(0) scale(1)}to{transform:translateX(-1.6%) scale(1.025)}}
.hero__overlay{display:none}
.hero__wordmark{position:absolute;left:var(--gutter);top:50%;transform:translateY(-50%);font-size:clamp(64px,13vw,260px);line-height:.82;white-space:normal;margin:0}
.hero__wordmark .line{display:block;overflow:hidden;padding-bottom:.04em}
.hero__wordmark .ch{display:inline-block;transform:translateY(110%);animation:rise 1s var(--ease) both;animation-delay:calc(var(--i) * 55ms + .35s)}
@keyframes rise{to{transform:none}}
.hero__eyebrow{position:absolute;left:var(--gutter);top:calc(50% - clamp(64px,13vw,260px) * .95);color:var(--fg);display:flex;gap:10px;align-items:center;animation:fadeUp .8s var(--ease) 1.1s both}
.hero__eyebrow::before{content:"";width:28px;height:1px;background:currentColor;transform-origin:left;animation:grow .8s var(--ease) 1.2s both}
@keyframes grow{from{transform:scaleX(0)}}
.hero__content{position:absolute;left:var(--gutter);bottom:var(--gutter);display:grid;gap:10px;justify-items:start;animation:fadeUp .9s var(--ease) 1.25s both}
.hero__content .caps{font-weight:600;color:var(--fg)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}}
.hero__scroll{position:absolute;right:var(--gutter);bottom:calc(var(--gutter) + 34px);display:flex;align-items:center;gap:10px;color:var(--fg);animation:fadeUp .9s var(--ease) 1.5s both}
.hero__scroll i{position:relative;display:block;width:1px;height:44px;background:rgba(26,20,16,.2);overflow:hidden}
.hero__scroll i::after{content:"";position:absolute;left:0;top:-50%;width:1px;height:50%;background:var(--brand);animation:scrollLine 1.8s var(--ease) infinite}
@keyframes scrollLine{to{top:100%}}
.hero .btn{position:relative;overflow:hidden}
.hero .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,243,224,.45) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.5s ease-in-out 2.4s infinite}
@keyframes shine{0%,60%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
@media(max-width:749px),(max-width:1100px) and (orientation:portrait){
  .hero__media{top:auto;height:62%;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 14%);mask-image:linear-gradient(to bottom,transparent,#000 14%)}
  .hero__media img{object-position:66% bottom}
  .hero__wordmark{top:calc(var(--header-h) + 34px);transform:none;font-size:24vw}
  .hero__eyebrow{top:calc(var(--header-h) + 10px)}
  .hero__content .caps{background:var(--bg);padding:3px 7px}
  .hero__scroll{display:none}
}
@media(prefers-reduced-motion:reduce){
  .hero__media img,.hero__wordmark .ch,.hero__eyebrow,.hero__eyebrow::before,.hero__content,.hero__scroll,.hero .btn::after,.hero__scroll i::after{animation:none!important;transform:none;clip-path:none;filter:none}
}
/* ---------- ticker ---------- */
.ticker{background:var(--brand);color:var(--bg);overflow:hidden;white-space:nowrap;border-block:1px solid var(--brand)}
.ticker__track{display:inline-flex;align-items:center;gap:22px;padding:11px 0;animation:tick 32s linear infinite;will-change:transform}
.ticker__track span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.ticker svg{width:15px;height:18px;flex:none}
.ticker:hover .ticker__track{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ticker__track{animation:none}}
.mark{display:inline-block;width:1em;height:1em;vertical-align:-.12em}
/* ---------- lookbook ---------- */
.lookbook{display:grid;gap:12px}
@media(min-width:750px){.lookbook{grid-template-columns:1.15fr 1fr;gap:20px;align-items:stretch;max-width:1080px;margin-left:auto}}
.look{position:relative;overflow:hidden;background:#efe2cc}
.look img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.look:hover img{transform:scale(1.04)}
.look--tall{aspect-ratio:3/4}
.look-stack{display:grid;gap:12px;grid-template-rows:1.3fr 1fr}
@media(min-width:750px){.look-stack{gap:20px}}
.look-stack .look{aspect-ratio:auto;min-height:220px}
.look figcaption{position:absolute;left:12px;bottom:12px;background:var(--bg);padding:4px 8px}
.look-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.look-head h2{font-size:clamp(40px,7vw,110px);color:var(--brand)}
.look-head p{max-width:34ch}
.footer-mark{display:flex;justify-content:center;margin:32px 0 0;color:var(--brand)}
.footer-mark svg{width:56px;height:64px}

/* ---------- catalog motion ---------- */
.card__media.has-photo{overflow:hidden}
.card__tilt{position:absolute;inset:0;transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--s,1));transition:transform .6s var(--ease);will-change:transform}
.card:hover .card__tilt{--s:1.05}
.card__float{position:absolute;inset:0;animation:float 7s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(-1.2%)}to{transform:translateY(1.2%)}}
.card__media .photo{transform:none!important}
.card__media .photo--back{opacity:0;transition:opacity .6s var(--ease)}
.card:hover .photo--back{opacity:1}
.card.reveal{opacity:1;transform:none}
.card.reveal .card__media{clip-path:inset(100% 0 0 0)}
.card.reveal .photo{scale:1.25;filter:blur(6px)}
.card.reveal.is-in .card__media{clip-path:inset(0 0 0 0);transition:clip-path 1.1s var(--ease) var(--delay,0ms)}
.card.reveal.is-in .photo{scale:1;filter:none;transition:scale 1.6s var(--ease) var(--delay,0ms),filter 1s var(--ease) var(--delay,0ms)}
.card.reveal .card__info{opacity:0;transform:translateY(12px)}
.card.reveal.is-in .card__info{opacity:1;transform:none;transition:opacity .8s var(--ease) calc(var(--delay,0ms) + 350ms),transform .8s var(--ease) calc(var(--delay,0ms) + 350ms)}
.card__num{position:absolute;top:10px;right:12px;color:var(--muted);transition:color .3s}
.card:hover .card__num{color:var(--brand)}
.card__name{position:relative;justify-self:start}
.card__name::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--brand);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.card:hover .card__name::after{transform:scaleX(1)}
.quick{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);padding:6px 6px 6px 12px;transform:translateY(calc(100% + 14px));transition:transform .45s var(--ease)}
.card:hover .quick,.card:focus-within .quick{transform:none}
.quick__sizes{display:flex;gap:4px}
.quick button{min-width:32px;height:30px;border:1px solid var(--line);font-size:10px;font-weight:600;transition:background .2s,color .2s,border-color .2s}
.quick button:hover:not([disabled]){background:var(--brand);color:var(--bg);border-color:var(--brand)}
.quick button[disabled]{color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.quick button.added{background:var(--fg);color:var(--bg)}
@media(hover:none){.quick{display:none}}
.split .line{display:block;overflow:hidden;padding-bottom:.06em}
.split .ch{display:inline-block;transform:translateY(110%);animation:rise 1s var(--ease) both;animation-delay:calc(var(--i) * 40ms + .1s)}
@keyframes rise{to{transform:none}}
@media(prefers-reduced-motion:reduce){.card__float,.split .ch{animation:none!important;transform:none}.card.reveal .card__media{clip-path:none}.card.reveal .photo{scale:1;filter:none}.card.reveal .card__info{opacity:1;transform:none}.card__tilt{transition:none}}

/* ---------- sections ---------- */
.section{padding-top:56px;padding-bottom:56px}
@media(min-width:990px){.section{padding-top:80px;padding-bottom:80px}}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.is-in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}#view{animation:none}}

/* ---------- product grid / card ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 12px}
@media(min-width:990px){.grid{grid-template-columns:repeat(3,1fr);gap:48px 28px}}
.card{display:block}
.card__media{position:relative;aspect-ratio:4/5;background:transparent;overflow:hidden}
.card__media .img{position:absolute;inset:6%;transition:opacity .5s var(--ease),transform .7s var(--ease)}
.card__media .img svg{width:100%;height:100%}
.card__media .img--hover{opacity:0}
.card__media.has-photo{background:#FFF3E0}
.card__media .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.card:hover .card__media .photo{transform:scale(1.12)}
.card.is-soldout .photo{opacity:.5}
.slide--photo{inset:0;background:#FFF3E0;overflow:hidden}
.slide--photo img{width:100%;height:100%;object-fit:contain}
.slide--zoom img{object-fit:cover;transform:scale(1.9)}
.item__img.has-photo{padding:0;background:#FFF3E0}
.item__img img{width:100%;height:100%;object-fit:cover}
.card:hover .img--hover{opacity:1}
.card:hover .img--main{opacity:0}
.card:hover .card__media .img{transform:scale(1.03)}
.badge{position:absolute;top:8px;left:8px;background:var(--brand);color:var(--bg);padding:3px 7px;font-size:10px}
.card__info{display:grid;gap:2px;margin-top:10px}
.card.is-soldout .img--main{opacity:.45}
.card.is-soldout:hover .img--main{opacity:0}
.card.is-soldout:hover .img--hover{opacity:.45}
s{color:var(--muted)}

/* ---------- newsletter ---------- */
.newsletter{text-align:center;display:grid;justify-items:center;gap:10px}
.newsletter h2{font-size:clamp(18px,2.4vw,26px);font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
.newsletter p{max-width:420px}
.nl-field{display:flex;width:min(420px,100%);margin-top:8px}
.nl-field input{flex:1;min-width:0;border:1px solid var(--fg);border-right:0;padding:0 12px;height:40px;font-size:12px;outline:none;border-radius:0;background:transparent}
.nl-msg{min-height:18px}

/* ---------- footer ---------- */
.site-footer{padding-top:48px;overflow:hidden}
.footer-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
.footer-top ul{display:flex;gap:16px;flex-wrap:wrap}
.footer-top a:hover{text-decoration:underline;text-underline-offset:3px}
.pay{display:flex;justify-content:center;gap:6px;margin:28px 0 12px;flex-wrap:wrap}
.pay span{display:inline-grid;place-items:center;height:20px;padding:0 6px;border:1px solid var(--line);font-size:8px;font-weight:600;letter-spacing:.04em}
.footer-wordmark{padding:0 calc(var(--gutter) / 2);margin-bottom:-.06em}
.footer-wordmark .wordmark{display:inline-block;font-size:18vw;color:var(--brand)}

/* ---------- collection ---------- */
.coll-head{padding-top:28px;display:grid;gap:14px}
.coll-head h1{font-size:clamp(40px,8vw,120px)}
.facets{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px;position:sticky;top:var(--header-h);background:var(--bg);z-index:5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border:1px solid var(--line)}
.chip[aria-pressed=true]{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.facets__right{display:flex;gap:16px;align-items:center}
.facets select{border:0;background:none;text-transform:uppercase;font-size:11px;letter-spacing:.06em;font-weight:500;cursor:pointer}
.facets label{display:flex;gap:6px;align-items:center;cursor:pointer}
.empty{padding:60px 0;text-align:center}

/* ---------- product page ---------- */
.product{display:grid;gap:24px;padding-top:16px;padding-bottom:56px}
@media(min-width:990px){
  .product{grid-template-columns:minmax(220px,1fr) minmax(0,2fr) minmax(260px,1fr);gap:32px;align-items:center;min-height:calc(100svh - var(--header-h));padding-top:0}
  .p-info{order:1}.p-media{order:2}.p-buy{order:3}
}
.p-media{order:-1}
.p-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.p-price{margin-top:2px}
.acc{margin-top:22px;border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:11px 0}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-weight:400}
.acc details[open] summary::after{content:"–"}
.acc .body{padding:0 0 14px;color:#333;max-width:42ch}
.acc table{border-collapse:collapse;width:100%;font-size:11px}
.acc td,.acc th{padding:4px 0;text-align:left;border-bottom:1px solid var(--line)}
.slider{position:relative;aspect-ratio:1/1;user-select:none;outline:none}
.slide{position:absolute;inset:4%;opacity:0;transition:opacity .45s var(--ease)}
.slide.is-active{opacity:1}
.slide svg{width:100%;height:100%}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;display:grid;place-items:center;z-index:2;transition:opacity .2s}
.arrow:hover{opacity:.5}
.arrow--prev{left:0}.arrow--next{right:0}
.count{position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.p-buy{display:grid;gap:16px}
fieldset{border:0;margin:0;padding:0}
legend{padding:0;margin-bottom:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);font-size:11px;font-weight:500;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.pill:hover{border-color:var(--brand)}
input:checked+.pill{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.pill.is-out{color:var(--muted);text-decoration:line-through}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);height:40px}
.qty button{width:36px;height:100%}
.qty input{width:34px;text-align:center;border:0;outline:none;-moz-appearance:textfield;background:none}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.buy-row{display:flex;gap:8px}
.alt-pay{display:grid;gap:6px}
.alt-pay button{height:44px;font-weight:700;font-size:13px}
.shop-pay{background:#5a31f4;color:#fff}
.paypal{background:#ffc439;color:#003087;font-style:italic}
.sticky-atc{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:10px var(--gutter);display:flex;align-items:center;gap:12px;justify-content:space-between;transform:translateY(110%);transition:transform .3s var(--ease)}
.sticky-atc.is-visible{transform:none}
@media(min-width:990px){.sticky-atc{display:none}}
.sticky-atc .btn{white-space:nowrap;flex:none}
.sticky-atc>div{min-width:0}
.sticky-atc>div>div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.related{border-top:1px solid var(--line)}

/* ---------- cart drawer ---------- */
.drawer{position:fixed;inset:0;z-index:60;visibility:hidden}
.drawer.is-open{visibility:visible}
.drawer__overlay{position:absolute;inset:0;background:rgba(0,0,0,.25);opacity:0;transition:opacity .3s var(--ease)}
.drawer.is-open .drawer__overlay{opacity:1}
.drawer__panel{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s var(--ease)}
.drawer.is-open .drawer__panel{transform:none}
.drawer__head{display:flex;justify-content:space-between;align-items:center;height:var(--header-h);padding:0 var(--gutter);border-bottom:1px solid var(--line)}
.drawer__items{flex:1;overflow:auto;padding:8px var(--gutter)}
.item{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.item__img{aspect-ratio:4/5;background:rgba(26,20,16,.04);padding:6px}
.item__img svg{width:100%;height:100%}
.item__info{display:grid;gap:3px;align-content:start}

function route() {
  const h = location.hash.slice(1) || 'home';
  cleanup.forEach(fn => fn()); cleanup = [];
  document.body.classList.toggle('is-home', h === 'home');
  document.body.classList.toggle('is-product', h.startsWith('product-'));
  closeMenu(); closeCart();
  let html;
  if (h === 'home') html = views.home();
  else if (h === 'shop') html = views.shop();
  else if (h === 'contact') html = views.contact();
  else if (h.startsWith('product-')) html = views.product(+h.split('-')[1]);
  else if (['terms','shipping','refund','legal'].includes(h)) html = views.policy(h);
  else html = views.home();
  view.innerHTML = html;
  view.style.animation = 'none'; view.offsetHeight; view.style.animation = '';
  scrollTo(0, 0);
  $$('[data-nav]').forEach(a => a.toggleAttribute('aria-current', a.dataset.nav === h || (h.startsWith('product') && a.dataset.nav === 'shop')));
  if (h === 'home') initHero();
  if (h === 'shop') initCollection();
  if (h.startsWith('product-')) initProduct(byId(+h.split('-')[1]) || products[0]);
  initNewsletter();
  initContact();
  initReveal();
  onScroll();
}
let leaving = false;
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || reduce || leaving) return;
  if (a.getAttribute('href') === location.hash) { e.preventDefault(); scrollTo({ top: 0, behavior: 'smooth' }); return; }
  e.preventDefault(); leaving = true;
  document.body.classList.add('leaving');
  setTimeout(() => { document.body.classList.remove('leaving'); leaving = false; location.hash = a.getAttribute('href'); }, 200);
});
addEventListener('hashchange', route);

/* ---------------- hero zoom ---------------- */
function initHero() {
  if (reduce) return;
  const hero = $('#hero'), media = $('#heroMedia'), word = $('.hero__wordmark', hero);
  let ticking = false;
  const run = () => {
    const r = hero.getBoundingClientRect();
    const p = Math.min(Math.max(-r.top / r.height, 0), 1);
    media.style.transform = `translateY(${p * 12}%) scale(${1 + p * 0.06})`;
    word.style.opacity = 1 - p * 1.4;
    word.style.translate = `0 ${p * -60}px`;
    ticking = false;
  };
  const on = () => { if (!ticking) { ticking = true; requestAnimationFrame(run); } };
  addEventListener('scroll', on, { passive: true });
  const move = e => {
    const r = hero.getBoundingClientRect();
    hero.style.setProperty('--mx', ((e.clientX - r.left) / r.width - 0.5).toFixed(3));
    hero.style.setProperty('--my', ((e.clientY - r.top) / r.height - 0.5).toFixed(3));
  };
  if (matchMedia('(pointer:fine)').matches) hero.addEventListener('pointermove', move);
  cleanup.push(() => removeEventListener('scroll', on));
  run();
}
/* ---------------- reveal ---------------- */
let io;
function initReveal() {
  const els = $$('.reveal', view);
  if (reduce || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('is-in')); return; }
  io?.disconnect();
  io = new IntersectionObserver(entries => entries.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); }
  }), { rootMargin: '0px 0px -8% 0px' });
  els.forEach((e, i) => { if (e.classList.contains('card')) { e.style.setProperty('--delay', (i % 3) * 140 + 'ms'); } else e.style.transitionDelay = '0ms'; io.observe(e); });
  initTilt();
}

/* ---------------- card tilt + quick add ---------------- */
function initTilt() {
  if (reduce || !matchMedia('(pointer:fine)').matches) return;
  $$('[data-tilt]', view).forEach(c => {
    if (c.dataset.tiltOn) return; c.dataset.tiltOn = 1;
    const t = $('.card__tilt', c);
    c.addEventListener('pointermove', e => {
      const r = c.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      t.style.setProperty('--ry', (x * 10).toFixed(2) + 'deg');
      t.style.setProperty('--rx', (y * -8).toFixed(2) + 'deg');
    });
    c.addEventListener('pointerleave', () => { t.style.setProperty('--ry', '0deg'); t.style.setProperty('--rx', '0deg'); });
  });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-quick]');
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  if (b.disabled) return;
  addToCart(byId(+b.dataset.quick), b.dataset.size, 1);

  toast(`Added ${title(byId(+b.dataset.quick))} — ${b.dataset.size}`);

}, true);

/* ---------------- collection ---------------- */
function initCollection() {
  const grid = $('#collGrid');
  const render = () => {
    let list = [...products].sort((a, b) => a.id - b.id).filter(p => (state.cat === 'all' || p.cat === state.cat) && (!state.instock || !p.soldout));
    if (state.sort === 'price-asc') list = [...list].sort((a, b) => a.price - b.price);
    if (state.sort === 'price-desc') list = [...list].sort((a, b) => b.price - a.price);
    if (state.sort === 'az') list = [...list].sort((a, b) => a.name.localeCompare(b.name));
    grid.innerHTML = list.length ? list.map(card).join('') : '<p class="caps empty muted" style="grid-column:1/-1">No products match these filters</p>';
    $('#resultCount').textContent = list.length + ' items';
    initReveal();
  };
  $('#chips').addEventListener('click', e => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    state.cat = b.dataset.cat;
    $$('[data-cat]').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });
  $('#sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
  $('#instock').addEventListener('change', e => { state.instock = e.target.checked; render(); });
  render();
}

/* ---------------- product ---------------- */
function initProduct(p) {
  // slider
  const slider = $('#slider'), slides = $$('.slide', slider), count = $('#slideCount');
  let i = 0;
  const go = n => { slides[i].classList.remove('is-active'); i = (n + slides.length) % slides.length; slides[i].classList.add('is-active'); count.textContent = `${i + 1} / ${slides.length}`; };
  $('[data-prev]', slider).onclick = () => go(i - 1);
  $('[data-next]', slider).onclick = () => go(i + 1);
  slider.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(i - 1); if (e.key === 'ArrowRight') go(i + 1); });
  let x0 = null;
  slider.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  slider.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); x0 = null; });

  // form
  const form = $('#buyForm'), qty = $('#qty'), btns = [$('#atc'), $('#atc2')];
  const update = () => {
    const sel = $('input[name=size]:checked', form);
    const available = sel && !sel.hasAttribute('data-out') && !p.soldout;
    const label = p.soldout ? 'Sold out' : !sel ? 'Select a size' : available ? `Add to cart — ${money(p.price * Math.max(1, +qty.value || 1))}` : 'Sold out';
    btns.forEach(b => { b.textContent = label; b.disabled = !available; });
    const sl = $('#sizeLabel'); if (sl) sl.textContent = sel ? sel.value : '';
  };
  form.addEventListener('change', update);
  $$('[data-step]', form).forEach(b => b.addEventListener('click', () => { qty.value = Math.max(1, (+qty.value || 1) + +b.dataset.step); update(); }));
  qty.addEventListener('input', update);
  form.addEventListener('submit', e => {
    e.preventDefault();
    const sel = $('input[name=size]:checked', form); if (!sel) return;
    btns.forEach(b => { b.disabled = true; b.textContent = 'Adding…'; });
    setTimeout(() => { addToCart(p, sel.value, Math.max(1, +qty.value || 1)); update(); openCart(); }, 350);
  });
  update();

  // sticky add-to-cart (mobile)
  const sticky = $('#stickyAtc');
  const obs = new IntersectionObserver(([en]) => sticky.classList.toggle('is-visible', !en.isIntersecting && en.boundingClientRect.top < 0));
  obs.observe($('#atc'));
  cleanup.push(() => obs.disconnect());
}

/* ---------------- cart ---------------- */
const drawer = $('#drawer');
function addToCart(p, size, q) {
  const key = p.id + '-' + size;
  const line = cart.find(l => l.key === key);
  if (line) line.qty += q; else cart.push({ key, id: p.id, size, qty: q });
  renderCart();
}
function renderCart() {
  const n = cart.reduce((s, l) => s + l.qty, 0);
  const total = cart.reduce((s, l) => s + l.qty * byId(l.id).price, 0);
  $('#cartCount').textContent = n;
  $('#drawerTitle').textContent = `Cart (${n})`;
  const body = $('#drawerBody');
  if (!cart.length) {
    body.innerHTML = `<div class="drawer__empty caps"><p>Your cart is empty</p><a class="btn" href="#shop" data-cart-close>Shop all</a></div>`;
    return;
  }
  body.innerHTML = `<ul class="drawer__items">${cart.map(l => {
    const p = byId(l.id);
    return `<li class="item">
      <a href="#product-${p.id}" class="item__img${p.img ? ' has-photo' : ''}" data-cart-close>${p.img ? `<img src="${p.img}" alt="">` : garment(p, 'front')}</a>
      <div class="item__info caps">
        <a href="#product-${p.id}" data-cart-close>${title(p)}</a>
        <span class="muted">Size ${l.size}</span>
        <span>${money(p.price * l.qty)}</span>
        <div class="item__row">
          <div class="qty qty--sm"><button data-change="${l.key}" data-d="-1" aria-label="Decrease">−</button><span>${l.qty}</span><button data-change="${l.key}" data-d="1" aria-label="Increase">+</button></div>
          <button class="link muted" data-remove="${l.key}">Remove</button>
        </div>
      </div>
    </li>`;
  }).join('')}</ul>
  <div class="drawer__foot">
    <div class="row caps"><span>Subtotal</span><span>${money(total)}</span></div>
    <p class="muted" style="font-size:11px">Taxes and shipping calculated at checkout.</p>
    <button class="btn btn--full" data-preview-only>Checkout — ${money(total)}</button>
  </div>`;
}
function openCart() { drawer.classList.add('is-open'); drawer.setAttribute('aria-hidden', 'false'); }
function closeCart() { drawer.classList.remove('is-open'); drawer.setAttribute('aria-hidden', 'true'); }
document.addEventListener('click', e => {
  if (e.target.closest('[data-cart-open]')) { openCart(); }
  if (e.target.closest('[data-cart-close]')) closeCart();
  const c = e.target.closest('[data-change]');
  if (c) { const l = cart.find(x => x.key === c.dataset.change); l.qty += +c.dataset.d; if (l.qty < 1) cart = cart.filter(x => x !== l); renderCart(); }
  const r = e.target.closest('[data-remove]');
  if (r) { cart = cart.filter(x => x.key !== r.dataset.remove); renderCart(); }
  if (e.target.closest('[data-preview-only]')) toast('Checkout runs on Shopify in the real theme');
});
addEventListener('keydown', e => { if (e.key === 'Escape') { closeCart(); closeMenu(); } });

/* ---------------- forms ---------------- */
function initNewsletter() {
  const f = $('#nlForm'); if (!f) return;
  f.addEventListener('submit', e => { e.preventDefault(); $('#nlMsg').textContent = "Thanks — you're on the list."; f.reset(); });
}
function initContact() {
  const f = $('#contactForm'); if (!f) return;
  f.addEventListener('submit', e => { e.preventDefault(); $('#contactMsg').textContent = "Thanks — we'll get back to you soon."; f.reset(); });
}
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------------- footer fit-text ---------------- */
function fit() {
  const el = $('#fit'); el.style.fontSize = '100px';
  const w = el.parentElement.clientWidth - parseFloat(getComputedStyle(el.parentElement).paddingLeft) * 2;
  el.style.fontSize = (100 * w / el.scrollWidth) + 'px';
}
addEventListener('resize', fit);
document.fonts?.ready.then(fit);

renderCart();
route();
fit();
})();
</script>
</body>
</html>
